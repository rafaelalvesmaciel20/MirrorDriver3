
name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto

      - name: Corrigir erro no Discovery.kt
        run: |
          DISCOVERY_FILE=$(find projeto -name "Discovery.kt" -print -quit)
          if [ -n "$DISCOVERY_FILE" ]; then
            echo "Corrigindo timeToLive em $DISCOVERY_FILE"
            sed -i 's/timeToLive/setTimeToLive(1)/g' "$DISCOVERY_FILE" || true
            sed -i 's/\.timeToLive\b/.setTimeToLive(1)/g' "$DISCOVERY_FILE" || true
          fi

      - name: Forçar compatibilidade Java 17 no app/build.gradle.kts
        run: |
          APP_BUILD_FILE=$(find projeto -path "*/app/build.gradle.kts" -print -quit)
          if [ -n "$APP_BUILD_FILE" ]; then
            echo "Injetando configurações de compatibilidade Java 17..."
            # Adiciona compileOptions e jvmToolchain no arquivo de build do app
            echo "" >> "$APP_BUILD_FILE"
            echo "android {" >> "$APP_BUILD_FILE"
            echo "    compileOptions {" >> "$APP_BUILD_FILE"
            echo "        sourceCompatibility = JavaVersion.VERSION_17" >> "$APP_BUILD_FILE"
            echo "        targetCompatibility = JavaVersion.VERSION_17" >> "$APP_BUILD_FILE"
            echo "    }" >> "$APP_BUILD_FILE"
            echo "}" >> "$APP_BUILD_FILE"
            echo "kotlin {" >> "$APP_BUILD_FILE"
            echo "    jvmToolchain(17)" >> "$APP_BUILD_FILE"
            echo "}" >> "$APP_BUILD_FILE"
          fi

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SETTINGS_FILE=$(find projeto -name "settings.gradle.kts" -print -quit)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
