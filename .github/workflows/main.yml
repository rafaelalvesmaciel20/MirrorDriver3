name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto

      - name: Forçar Java 17 no projeto
        run: |
          # Procura todos os arquivos build.gradle.kts e força o jvmToolchain para 17
          find projeto -name "build.gradle.kts" | while read -r file; do
            echo "Atualizando $file para Java 17..."
            echo "" >> "$file"
            echo "kotlin {" >> "$file"
            echo "    jvmToolchain(17)" >> "$file"
            echo "}" >> "$file"
          done

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SETTINGS_FILE=$(find projeto -name "settings.gradle.kts" -print -quit)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
