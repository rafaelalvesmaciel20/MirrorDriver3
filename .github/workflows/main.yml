
name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

            - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto
          find projeto -name settings.gradle.kts -print

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(dirname "$(find projeto -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
