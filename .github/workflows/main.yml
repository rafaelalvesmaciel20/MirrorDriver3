name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SETTINGS_FILE=$(find projeto -name "settings.gradle.kts" -print -quit)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Compila o projeto alinhando as propriedades de compatibilidade do Java/Kotlin via linha de comando
          gradle :app:assembleDebug \
            -Pandroid.compileSdk=35 \
            -Pandroid.targetSdk=35 \
            -Pandroid.minSdk=24 \
            --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
