name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto
          echo "=== Listando arquivos extraídos ==="
          find projeto -maxdepth 3

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Procura a pasta que contém o arquivo build.gradle.kts ou settings.gradle.kts
          BUILD_FILE=$(find projeto -name "settings.gradle.kts" -o -name "build.gradle.kts" -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "Erro: Arquivo de projeto Gradle não encontrado!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Diretório do projeto: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Se não existir gradlew, cria ele automaticamente na versão 8.9
          if [ ! -f "gradlew" ]; then
            echo "Gerando gradlew automaticamente..."
            gradle wrapper --gradle-version 8.9
          fi
          
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
