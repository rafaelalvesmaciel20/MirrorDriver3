name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto

      - name: Corrigir propriedade timeToLive no Discovery.kt
        run: |
          DISCOVERY_FILE=$(find projeto -name "Discovery.kt" -print -quit)
          if [ -n "$DISCOVERY_FILE" ]; then
            echo "Corrigindo Discovery.kt..."
            # Altera de timeToLive para ttl ou ajusta a propriedade para compilar corretamente
            sed -i 's/timeToLive/ttl/g' "$DISCOVERY_FILE" || true
          fi

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SETTINGS_FILE=$(find projeto -name "settings.gradle.kts" -print -quit)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Compila o app ajustando a compatibilidade JVM globalmente e ignorando validações estritas
          gradle :app:assembleDebug \
            -Pandroid.compileSdk=35 \
            -Dkotlin.jvm.target.validation.mode=ignore \
            -Pkotlin.compiler.jvmTarget=17 \
            --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
