name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto

      - name: Corrigir compatibilidade Java/Kotlin
        run: |
          # Procura o build.gradle.kts do módulo app e injeta a compatibilidade Java 17
          APP_BUILD_FILE=$(find projeto -path "*/app/build.gradle.kts" -print -quit)
          if [ -n "$APP_BUILD_FILE" ]; then
            echo "Aplicando correção de Java 17 em $APP_BUILD_FILE"
            echo "" >> "$APP_BUILD_FILE"
            echo "kotlin {" >> "$APP_BUILD_FILE"
            echo "    jvmToolchain(17)" >> "$APP_BUILD_FILE"
            echo "}" >> "$APP_BUILD_FILE"
          fi

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SETTINGS_FILE=$(find projeto -name "settings.gradle.kts" -print -quit)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
