name: Build MirrorDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto
        run: |
          unzip -o MirrorDrive-GitHub-Build-3.zip -d projeto
          echo "=== Estrutura extraída ==="
          find projeto -maxdepth 3

      - name: Compilar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Encontra a pasta onde está o gradlew
          GRADLEW_PATH=$(find projeto -name gradlew -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erro: gradlew não encontrado!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Diretório do projeto encontrado: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorDrive-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
